<!DOCTYPE html>
<html>
<head>
    <title>Money Mission</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu">
        <img src="images/logo.png" alt="Money Mission Logo" id="logo">
        <p class="tagline">
            Learn how to save, spend, invest, and give wisely.
        </p>
        <div class="button-container">
            <button id="start-button">🏆Start Game</button>
            <button id="how-button">📖How to Play</button>
            <button id="credits-button">🌟Credits</button>
        </div>
    </div>

    <div id="game-screen">
    <h1> Week 1 </h1>
    <p>You have $<span id="money-display">20</span>.</p>
    <button id="save-button">💰 Save $5</button>
    <button id="spend-button">🛍️ Spend $5</button>
    <button id="give-button">🎁 Give $5</button>
    <button id="invest-button">📈 Invest $5</button>
    <button id="menu-button">Back to Menu</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
